# Chapter -> example manifest for the CI-built site.
#
# HOW THIS WORKS:
# - CI does NOT render any R. It only picks up whichever files already exist at the
#   `html` (or `asset`) path below and copies them into the website, organized by
#   chapter.
# - Your local workflow is unchanged: knit with the existing render*.sh / rmd_exec*
#   scripts in src/, the .html lands next to the .Rmd exactly as it does today, then
#   git add / git commit / git push (gitPush.sh) as usual. The next push triggers the
#   site rebuild automatically.
# - html/asset paths point at the source location in src/ (or wherever the file
#   currently only exists), not the old hand-copied Chapter*/ location. Chapter*/
#   folders on main can be retired once this is live -- the website becomes the
#   published copy instead.
#
# Entries marked "NEEDS REVIEW" were flagged during the migration audit -- see
# BGC_2023_migration_plan.md for why. Don't delete/merge those without checking with
# Prof. Banerjee first.

